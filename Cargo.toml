[workspace]
resolver = "3"
members = [
  "crates/server_evdev",
  "crates/fraypad_protocol",
  "crates/client_gdext",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/fraypad-hq/fraypad"
homepage = "https://github.com/fraypad-hq/fraypad"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0"
fraypad_protocol = { path = "crates/fraypad_protocol", version = "0.3.0" }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[workspace.lints.rust]
missing_docs = "warn"
