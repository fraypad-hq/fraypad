[workspace]
resolver = "3"
members = [
  "crates/server_evdev",
  "crates/fraypad_protocol",
  "crates/fraypad_server_core",
  "crates/client_gdext",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/fraypad-hq/fraypad"
homepage = "https://github.com/fraypad-hq/fraypad"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0"
evdev = "0.13"
nix = { version = "0.29", features = ["fs"] }
godot = "0.5"
fraypad_protocol = { path = "crates/fraypad_protocol", version = "0.3.0" }
fraypad_server_core = { path = "crates/fraypad_server_core", version = "0.3.0" }

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[workspace.lints.rust]
missing_docs = "warn"

# The Android client is shipped as a native lib; keep it small and fast in
# release, and give the naive debug profile enough optimisation to be usable
# (the unoptimised .so is >100 MB and stutters on-device).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package.client_gdext]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
