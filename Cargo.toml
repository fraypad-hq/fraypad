[workspace]
resolver = "3"
members = [
  "crates/server_evdev",
  "crates/fraypad_protocol",
  "crates/fraypad_server_core",
  "crates/client_gdext",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/fraypad-hq/fraypad"
homepage = "https://github.com/fraypad-hq/fraypad"

[workspace.dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0"
evdev = "0.13"
nix = { version = "0.29", features = ["fs"] }
godot = "0.5"
fraypad_protocol = { path = "crates/fraypad_protocol", version = "0.3.0" }
fraypad_server_core = { path = "crates/fraypad_server_core", version = "0.3.0" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_panics_doc = "allow"

[workspace.lints.rust]
missing_docs = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package.client_gdext]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
